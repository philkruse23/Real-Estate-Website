backend:
  name: github
  repo: philkruse23/Real-Estate-Website
  branch: main
  base_url: https://sveltia-cms-auth.philkrusehomes.workers.dev

media_folder: "images"
public_folder: "/images"

collections:
  - name: "posts"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Category", name: "category", widget: "string", hint: "e.g. Market Update, Neighborhood Guide, Orlando Life" }
      - { label: "Teaser (short summary for the blog listing page)", name: "teaser", widget: "text" }
      - { label: "Cover Image", name: "image", widget: "image" }
      - { label: "Body", name: "body", widget: "markdown" }
